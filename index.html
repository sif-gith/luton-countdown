<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Countdown to Luton Arrival</title>
  <style>
    body {
      background-color: #f0f4f8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: #2c3e50;
    }
    h2 {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      color: #34495e;
    }
    .countdown {
      font-size: 3rem;
      color: #e74c3c;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Countdown to Arrival at Luton Airport</h1>
  <h2>Touchdown is set for Thursday, 2nd May 2025 at 2:24:47 PM</h2>
  <div class="countdown" id="countdown">Loading...</div>

  <script>
    const countdownElement = document.getElementById("countdown");
    const targetDate = new Date("May 2, 2025 14:24:47").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance <= 0) {
        countdownElement.innerHTML = "Arrived!";
        clearInterval(interval);
        return;
      }

      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));

      countdownElement.innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    const interval = setInterval(updateCountdown, 1000);
    updateCountdown(); // initial call
  </script>
</body>
</html>
