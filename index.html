<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Countdown to Luton Arrival</title>
  <style>
    body {
      background-color: #f0f4f8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      color: #2c3e50;
    }
    h2 {
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
      color: #34495e;
    }
    .countdown, .clock {
      font-size: 2.2rem;
      font-weight: bold;
      margin: 0.5rem 0;
    }
    .countdown {
      color: #e74c3c;
    }
    .clock {
      color: #3498db;
    }
    @media (max-width: 480px) {
      h1 { font-size: 1.6rem; }
      h2 { font-size: 1rem; }
      .countdown, .clock { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <h1>Countdown to Arrival at Luton Airport</h1>
  <h2>Touchdown is set for Thursday, 2nd May 2025 at 2:24:47 PM</h2>
  
  <div class="clock" id="clock">--:--:--</div>
  <div class="countdown" id="countdown">Loading...</div>

  <script>
    const countdownElement = document.getElementById("countdown");
    const clockElement = document.getElementById("clock");

    const targetDate = new Date("May 2, 2025 14:24:47").getTime();

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      clockElement.textContent = `${hours}:${minutes}:${seconds}`;
    }

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance <= 0) {
        countdownElement.innerHTML = "Arrived!";
        clearInterval(countdownInterval);
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      countdownElement.innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    // Start both intervals
    updateClock();
    updateCountdown();

    setInterval(updateClock, 1000);
    const countdownInterval = setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
