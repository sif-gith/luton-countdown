<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Countdown to Luton Arrival</title>
  <style>
    body {
      background-color: #f0f4f8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: #2c3e50;
    }
    h2 {
      font-size: 1.1rem;
      margin-bottom: 2rem;
      color: #34495e;
    }
    canvas {
      background: #fff;
      border: 8px solid #2c3e50;
      border-radius: 50%;
    }
    .message {
      font-size: 1.5rem;
      margin-top: 1.5rem;
      color: #e74c3c;
    }
  </style>
</head>
<body>
  <h1>Countdown to Arrival at Luton Airport</h1>
  <h2>Thursday, 2nd May 2025 at 2:24:47 PM</h2>
  <canvas id="clock" width="300" height="300"></canvas>
  <div class="message" id="message"></div>

  <script>
    const canvas = document.getElementById('clock');
    const ctx = canvas.getContext('2d');
    const message = document.getElementById('message');
    const radius = canvas.height / 2;
    ctx.translate(radius, radius);

    const targetTime = new Date("May 2, 2025 14:24:47").getTime();

    function drawClock(remainingTime) {
      ctx.clearRect(-radius, -radius, canvas.width, canvas.height);

      // Draw face
      ctx.beginPath();
      ctx.arc(0, 0, radius - 10, 0, 2 * Math.PI);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.strokeStyle = '#2c3e50';
      ctx.lineWidth = 4;
      ctx.stroke();

      // Hour marks
      for (let num = 1; num <= 12; num++) {
        const ang = num * Math.PI / 6;
        ctx.rotate(ang);
        ctx.translate(0, -radius * 0.85);
        ctx.rotate(-ang);
        ctx.fillStyle = "#2c3e50";
        ctx.font = "16px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(num.toString(), 0, 0);
        ctx.rotate(ang);
        ctx.translate(0, radius * 0.85);
        ctx.rotate(-ang);
      }

      // Total seconds remaining
      const totalSeconds = Math.floor(remainingTime / 1000);
      const totalHours = Math.floor(totalSeconds / 3600);
      const totalMinutes = Math.floor((totalSeconds % 3600) / 60);
      const totalSecs = totalSeconds % 60;

      // Angle per unit (scaled to 12-hour clock)
      const maxDuration = targetTime - new Date().getTime();
      const progress = Math.max(remainingTime / maxDuration, 0);

      const hourAngle = 2 * Math.PI * progress;
      const minuteAngle = hourAngle * 12;
      const secondAngle = minuteAngle * 60;

      // Hour hand
      drawHand(hourAngle, radius * 0.5, 6, "#e74c3c");
      // Minute hand
      drawHand(minuteAngle, radius * 0.7, 4, "#3498db");
      // Second hand
      drawHand(secondAngle, radius * 0.9, 2, "#2ecc71");
    }

    function drawHand(pos, length, width, color) {
      ctx.beginPath();
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.strokeStyle = color;
      ctx.moveTo(0, 0);
      ctx.rotate(pos);
      ctx.lineTo(0, -length);
      ctx.stroke();
      ctx.rotate(-pos);
    }

    function update() {
      const now = new Date().getTime();
      const remaining = targetTime - now;

      if (remaining <= 0) {
        drawClock(0);
        message.textContent = "Arrived!";
        clearInterval(tick);
        return;
      }

      drawClock(remaining);
    }

    const tick = setInterval(update, 1000);
    update(); // Initial draw
  </script>
</body>
</html>
