<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Countdown to Luton Arrival</title>
  <style>
    body {
      background-color: #f0f4f8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      text-align: center;
      box-sizing: border-box;
    }

    h1 {
      font-size: 2rem;
      color: #2c3e50;
      margin-bottom: 0.3rem;
    }

    h2 {
      font-size: 1rem;
      color: #34495e;
      margin-bottom: 2rem;
    }

    canvas {
      background-color: white;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin-top: 1rem;
    }

    .countdown-text {
      font-size: 1.5rem;
      color: #e67e22;
      font-weight: bold;
      margin-top: 1rem;
    }

    .info-text {
      font-size: 0.9rem;
      color: #34495e;
      margin-top: 0.5rem;
    }

    .message {
      font-size: 1.2rem;
      color: #2c3e50;
      margin-top: 2rem;
    }

    @media (max-width: 480px) {
      canvas {
        width: 220px !important;
        height: 220px !important;
      }
    }
  </style>
</head>
<body>
  <h1>Countdown to Arrival at Luton Airport</h1>
  <h2>Thursday, 2nd May 2025 at 2:24:47 PM</h2>

  <div class="countdown-text" id="countdownText">Loading...</div>
  <div class="info-text" id="infoText"></div>
  <canvas id="clock" width="300" height="300"></canvas>
  <div class="message" id="message"></div>

  <script>
    const canvas = document.getElementById("clock");
    const ctx = canvas.getContext("2d");
    const radius = canvas.width / 2;
    ctx.translate(radius, radius);

    const targetDate = new Date("May 2, 2025 14:24:47").getTime();
    const startWindow = targetDate - 12 * 60 * 60 * 1000; // 12 hours before

    const messageEl = document.getElementById("message");
    const countdownText = document.getElementById("countdownText");
    const infoText = document.getElementById("infoText");

    function drawStaticClock() {
      ctx.clearRect(-radius, -radius, canvas.width, canvas.height);
      drawFace();
      drawHand(0, radius - 80, 6, "#2c3e50"); // hour
      drawHand(0, radius - 60, 4, "#2980b9"); // minute
      drawHand(0, radius - 40, 2, "#e74c3c"); // second
      drawCenter();
    }

    function drawClock(hoursLeft, minutesLeft, secondsLeft) {
      ctx.clearRect(-radius, -radius, canvas.width, canvas.height);
      drawFace();

      const hourAngle = ((hoursLeft + minutesLeft / 60) * Math.PI) / 6;
      const minuteAngle = ((minutesLeft + secondsLeft / 60) * Math.PI) / 30;
      const secondAngle = (secondsLeft * Math.PI) / 30;

      drawHand(hourAngle, radius - 80, 6, "#2c3e50");
      drawHand(minuteAngle, radius - 60, 4, "#2980b9");
      drawHand(secondAngle, radius - 40, 2, "#e74c3c");
      drawCenter();
    }

    function drawFace() {
      ctx.beginPath();
      ctx.arc(0, 0, radius - 5, 0, 2 * Math.PI);
      ctx.fillStyle = "#fff";
      ctx.fill();
      ctx.strokeStyle = "#ccc";
      ctx.lineWidth = 4;
      ctx.stroke();

      for (let i = 0; i < 60; i++) {
        const angle = (i * Math.PI) / 30;
        const inner = radius - 10;
        const outer = i % 5 === 0 ? radius - 20 : radius - 15;
        ctx.beginPath();
        ctx.moveTo(inner * Math.cos(angle), inner * Math.sin(angle));
        ctx.lineTo(outer * Math.cos(angle), outer * Math.sin(angle));
        ctx.strokeStyle = "#888";
        ctx.lineWidth = i % 5 === 0 ? 3 : 1;
        ctx.stroke();
      }
    }

    function drawHand(angle, length, width, color) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(length * Math.cos(angle - Math.PI / 2), length * Math.sin(angle - Math.PI / 2));
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.stroke();
    }

    function drawCenter() {
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, 2 * Math.PI);
      ctx.fillStyle = "#333";
      ctx.fill();
    }

    function updateCountdown() {
      const now = new Date().getTime();
      const remaining = targetDate - now;

      if (remaining <= 0) {
        countdownText.textContent = "Arrived!";
        infoText.textContent = "";
        messageEl.textContent = "";
        clearInterval(timer);
        return;
      }

      const hours = Math.floor((remaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

      countdownText.textContent = `${hours}h ${minutes}m ${seconds}s`;

      if (now >= startWindow) {
        infoText.textContent = "";
        drawClock(hours, minutes, seconds);
      } else {
        infoText.textContent = "Clock will start at 2:25 AM";
        drawStaticClock();
      }
    }

    const timer = setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
