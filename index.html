<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Countdown to Luton Arrival</title>
  <style>
    body {
      background-color: #f0f4f8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      text-align: center;
      box-sizing: border-box;
    }

    h1 {
      font-size: 2rem;
      color: #2c3e50;
      margin-bottom: 0.3rem;
    }

    h2 {
      font-size: 1rem;
      color: #34495e;
      margin-bottom: 2rem;
    }

    canvas {
      background-color: white;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: none;
    }

    .message, .countdown-text {
      font-size: 1.2rem;
      color: #e74c3c;
      font-weight: bold;
      margin-top: 1.5rem;
    }

    .info-text {
      font-size: 0.9rem;
      color: #34495e;
      margin-top: 1rem;
    }

    @media (max-width: 480px) {
      canvas {
        width: 220px !important;
        height: 220px !important;
      }
    }
  </style>
</head>
<body>
  <h1>Countdown to Arrival at Luton Airport</h1>
  <h2>Thursday, 2nd May 2025 at 2:24:47 PM</h2>
  <canvas id="clock" width="300" height="300"></canvas>
  <div class="message" id="message">Loading...</div>
  <div class="countdown-text" id="countdownText"></div>
  <div class="info-text" id="infoText"></div>

  <script>
    const canvas = document.getElementById("clock");
    const ctx = canvas.getContext("2d");
    const radius = canvas.width / 2;
    ctx.translate(radius, radius);

    const targetDate = new Date("May 2, 2025 14:24:47").getTime();
    const startWindow = targetDate - 12 * 60 * 60 * 1000; // 12 hours before

    const messageEl = document.getElementById("message");
    const countdownText = document.getElementById("countdownText");
    const infoText = document.getElementById("infoText");

    // Draw static "inactive" clock (12:00) before 2:25am
    function drawStaticClock() {
      ctx.clearRect(-radius, -radius, canvas.width, canvas.height);

      // Draw clock face
      ctx.beginPath();
      ctx.arc(0, 0, radius - 5, 0, 2 * Math.PI);
      ctx.fillStyle = "#fff";
      ctx.fill();
      ctx.strokeStyle = "#ccc";
      ctx.lineWidth = 4;
      ctx.stroke();

      // Draw ticks
      for (let i = 0; i < 60; i++) {
        const angle = (i * Math.PI) / 30;
        const inner = radius - 10;
        const outer = i % 5 === 0 ? radius - 20 : radius - 15;
        ctx.beginPath();
        ctx.moveTo(inner * Math.cos(angle), inner * Math.sin(angle));
        ctx.lineTo(outer * Math.cos(angle), outer * Math.sin(angle));
        ctx.strokeStyle = "#888";
        ctx.lineWidth = i % 5 === 0 ? 3 : 1;
        ctx.stroke();
      }

      // Hour hand (static at 12)
      const hourAngle = 0;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(
        (radius - 80) * Math.cos(hourAngle - Math.PI / 2),
        (radius - 80) * Math.sin(hourAngle - Math.PI / 2)
      );
      ctx.strokeStyle = "#2c3e50";
      ctx.lineWidth = 6;
      ctx.stroke();

      // Minute hand (static at 12)
      const minuteAngle = 0;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(
        (radius - 60) * Math.cos(minuteAngle - Math.PI / 2),
        (radius - 60) * Math.sin(minuteAngle - Math.PI / 2)
      );
      ctx.strokeStyle = "#2980b9";
      ctx.lineWidth = 4;
      ctx.stroke();

      // Second hand (static at 12)
      const secondAngle = 0;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(
        (radius - 40) * Math.cos(secondAngle - Math.PI / 2),
        (radius - 40) * Math.sin(secondAngle - Math.PI / 2)
      );
      ctx.strokeStyle = "#e74c3c";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Center dot
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, 2 * Math.PI);
      ctx.fillStyle = "#333";
      ctx.fill();
    }

    function drawClock(hoursLeft, minutesLeft, secondsLeft) {
      ctx.clearRect(-radius, -radius, canvas.width, canvas.height);

      // Draw clock face
      ctx.beginPath();
      ctx.arc(0, 0, radius - 5, 0, 2 * Math.PI);
      ctx.fillStyle = "#fff";
      ctx.fill();
      ctx.strokeStyle = "#ccc";
      ctx.lineWidth = 4;
      ctx.stroke();

      // Draw ticks
      for (let i = 0; i < 60; i++) {
        const angle = (i * Math.PI) / 30;
        const inner = radius - 10;
        const outer = i % 5 === 0 ? radius - 20 : radius - 15;
        ctx.beginPath();
        ctx.moveTo(inner * Math.cos(angle), inner * Math.sin(angle));
        ctx.lineTo(outer * Math.cos(angle), outer * Math.sin(angle));
        ctx.strokeStyle = "#888";
        ctx.lineWidth = i % 5 === 0 ? 3 : 1;
        ctx.stroke();
      }

      // Convert time left into angles (as if it's a 12-hour countdown clock)
      const totalSeconds = hoursLeft * 3600 + minutesLeft * 60 + secondsLeft;

      const hourAngle = ((hoursLeft + minutesLeft / 60) * Math.PI) / 6;
      const minuteAngle = ((minutesLeft + secondsLeft / 60) * Math.PI) / 30;
      const secondAngle = (secondsLeft * Math.PI) / 30;

      // Hour hand
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(
        (radius - 80) * Math.cos(hourAngle - Math.PI / 2),
        (radius - 80) * Math.sin(hourAngle - Math.PI / 2)
      );
      ctx.strokeStyle = "#2c3e50";
      ctx.lineWidth = 6;
      ctx.stroke();

      // Minute hand
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(
        (radius - 60) * Math.cos(minuteAngle - Math.PI / 2),
        (radius - 60) * Math.sin(minuteAngle - Math.PI / 2)
      );
      ctx.strokeStyle = "#2980b9";
      ctx.lineWidth = 4;
      ctx.stroke();

      // Second hand
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(
        (radius - 40) * Math.cos(secondAngle - Math.PI / 2),
        (radius - 40) * Math.sin(secondAngle - Math.PI / 2)
      );
      ctx.strokeStyle = "#e74c3c";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Center dot
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, 2 * Math.PI);
      ctx.fillStyle = "#333";
      ctx.fill();
    }

    function updateCountdown() {
      const now = new Date().getTime();

      if (now < startWindow) {
        canvas.style.display = "none";
        messageEl.textContent = "Countdown begins at 2:25 AM on May 2, 2025";
        countdownText.textContent = "";
        infoText.textContent = "Clock will start at 2:25 AM";
        return;
      }

      if (now >= targetDate) {
        canvas.style.display = "none";
        messageEl.textContent = "Arrived!";
        countdownText.textContent = "";
        infoText.textContent = "";
        clearInterval(timer);
        return;
      }

      canvas.style.display = "block";
      messageEl.textContent = "Time remaining:";

      const remaining = targetDate - now;

      const hours = Math.floor((remaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

      countdownText.textContent = `${hours}h ${minutes}m ${seconds}s`;

      if (now >= startWindow) {
        drawClock(hours, minutes, seconds);
      } else {
        drawStaticClock();
      }
    }

    const timer = setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
